[project]
name = "ai-engineering-platform"
version = "0.1.0"
description = "AI Engineering Intelligence Platform — ingestion and knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.0",
]
rag = [
    "qdrant-client>=1.13.0,<1.15.0",
    "fastembed>=0.4",
]
rag-openai = [
    "qdrant-client>=1.13.0,<1.15.0",
    "openai>=1.0",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
platform = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
    "mcp>=1.2,<2",  # avoid unrelated mcp 2.x package on PyPI
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ingest = "src.ingestion.run:main"
graph-load = "src.graph.run:main"
rag-index = "src.rag.run:main"
copilot = "src.agents.run:main"
platform-api = "src.api.main:run"
engineering-mcp = "src.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require cloned source-repo/services",
    "neo4j: tests that require a running Neo4j instance",
    "qdrant: tests that require a running Qdrant instance",
]
