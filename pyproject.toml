[project]
name = "ai-engineering-platform"
version = "0.1.0"
description = "AI Engineering Intelligence Platform — ingestion and knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require cloned source-repo/services",
]
